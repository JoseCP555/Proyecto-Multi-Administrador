services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multiadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multiadmin}
      POSTGRES_DB: ${POSTGRES_DB:-multiadmin_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multiadmin} -d ${POSTGRES_DB:-multiadmin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USER:-local}/multiadmin-backend:latest
    build:
      context: ./back
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-multiadmin}:${POSTGRES_PASSWORD:-multiadmin}@db:5432/${POSTGRES_DB:-multiadmin_db}
      SECRET_KEY: ${SECRET_KEY:-cambia-esto-por-un-valor-secreto-largo-y-aleatorio}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      SQL_ECHO: ${SQL_ECHO:-false}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SERVER: ${MAIL_SERVER:-}
    volumes:
      - documentos_data:/app/archivos_documentos
    ports:
      - "8000:8000"

  frontend:
    image: ${DOCKER_USER:-local}/multiadmin-frontend:latest
    build:
      context: ./React
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  documentos_data:
