<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finanzas - Multi Admin</title>

    <link rel="stylesheet" href="pagina11.css">

    <!-- ICONOS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

    <!-- HEADER -->

    <header class="top-header">

        <h1 class="logo-top">
            Mul-Admi
        </h1>

    </header>

    <!-- LINEA AZUL -->

    <div class="top-line"></div>

    <!-- CONTENEDOR -->

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <h2 class="sidebar-title">
                    Multi-Administrador
                </h2>

                <h3 class="menu-title">
                    MENU
                </h3>

                <!-- MENU -->

                <div class="menu">

                    <button>
                        <span>
                            <i class="fa-solid fa-house"></i>
                            Propiedades
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-users"></i>
                            Residentes
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button class="active">
                        <span>
                            <i class="fa-solid fa-dollar-sign"></i>
                            Finanzas
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-wrench"></i>
                            Mantenimiento
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-folder"></i>
                            Documentos
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-chart-column"></i>
                            Reportes
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-gear"></i>
                            Configuración
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                </div>

            </div>

            <!-- FOOTER -->

            <div class="sidebar-footer">

                <p>
                    <i class="fa-solid fa-headset"></i>
                    Soporte Técnico
                </p>

                <p>
                    <i class="fa-regular fa-circle-question"></i>
                    Centro de Ayuda
                </p>

            </div>

        </aside>

        <!-- MAIN -->

        <main class="main">

            <!-- TOPBAR -->

            <div class="topbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" placeholder="Buscar">

                </div>

                <div class="top-icons">

                    <i class="fa-regular fa-calendar"></i>

                    <i class="fa-solid fa-bell"></i>

                    <i class="fa-solid fa-message"></i>

                    <div class="separator"></div>

                    <i class="fa-solid fa-user"></i>

                </div>

            </div>

            <!-- MODO ADMIN -->

            <div class="admin-mode">

                <button>
                    Modo Administrador
                </button>

            </div>

            <!-- TARJETAS -->

            <div class="finance-container">

                <!-- CARD 1 -->

                <div class="finance-card">

                    <h2>Conjunto Residencial Marensa</h2>

                    <label>Pagos</label>

                    <select>
                        <option>Electricidad</option>
                        <option>Agua</option>
                        <option>Vigilancia</option>
                        <option>Aseo</option>
                        <option>Proveedores</option>
                        <option>Equipo</option>
                    </select>

                    <label>Bancos</label>

                    <select multiple class="banks">

                        <option>Nequi</option>
                        <option>Daviplata</option>
                        <option>Bancolombia</option>
                        <option>Banco de Bogotá</option>
                        <option>Davivienda</option>
                        <option>BBVA</option>
                        <option>Banco de Occidente</option>
                        <option>Banco Popular</option>
                        <option>Banco AV Villas</option>
                        <option>Banco Caja Social</option>
                        <option>Movii</option>
                        <option>Tpaga</option>

                    </select>

                </div>

                <!-- CARD 2 -->

                <div class="finance-card">

                    <h2>Edificio Época II</h2>

                    <label>Pagos</label>

                    <select>
                        <option>Electricidad</option>
                        <option>Agua</option>
                        <option>Vigilancia</option>
                        <option>Aseo</option>
                        <option>Proveedores</option>
                        <option>Equipo</option>
                    </select>

                    <label>Bancos</label>

                    <select multiple class="banks">

                        <option>Nequi</option>
                        <option>Daviplata</option>
                        <option>Bancolombia</option>
                        <option>Banco de Bogotá</option>
                        <option>Davivienda</option>
                        <option>BBVA</option>
                        <option>Banco de Occidente</option>
                        <option>Banco Popular</option>
                        <option>Banco AV Villas</option>
                        <option>Banco Caja Social</option>
                        <option>Movii</option>
                        <option>Tpaga</option>

                    </select>

                </div>

                <!-- CARD 3 -->

                <div class="finance-card">

                    <h2>Conjunto Residencial Chamizo</h2>

                    <label>Pagos</label>

                    <select>
                        <option>Electricidad</option>
                        <option>Agua</option>
                        <option>Vigilancia</option>
                        <option>Aseo</option>
                        <option>Proveedores</option>
                        <option>Equipo</option>
                    </select>

                    <label>Bancos</label>

                    <select multiple class="banks">

                        <option>Nequi</option>
                        <option>Daviplata</option>
                        <option>Bancolombia</option>
                        <option>Banco de Bogotá</option>
                        <option>Davivienda</option>
                        <option>BBVA</option>
                        <option>Banco de Occidente</option>
                        <option>Banco Popular</option>
                        <option>Banco AV Villas</option>
                        <option>Banco Caja Social</option>
                        <option>Movii</option>
                        <option>Tpaga</option>

                    </select>

                </div>

            </div>

        </main>

    </div>

<script src="pagina11.js"></script>

</body>

</html>
