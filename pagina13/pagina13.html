<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documentos - Multi Admin</title>

    <link rel="stylesheet" href="pagina13.css">

    <!-- ICONOS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

    <!-- HEADER -->

    <header class="top-header">

        <h1 class="logo-top">
            Mul-Admi
        </h1>

    </header>

    <!-- LINEA AZUL -->

    <div class="top-line"></div>

    <!-- CONTENEDOR -->

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <h2 class="sidebar-title">
                    Multi-Administrador
                </h2>

                <h3 class="menu-title">
                    MENU
                </h3>

                <!-- MENU -->

                <div class="menu">

                    <button>
                        <span>
                            <i class="fa-solid fa-house"></i>
                            Propiedades
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-users"></i>
                            Residentes
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-dollar-sign"></i>
                            Finanzas
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                            Mantenimiento
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button class="active">
                        <span>
                            <i class="fa-solid fa-folder"></i>
                            Documentos
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-chart-column"></i>
                            Reportes
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                    <button>
                        <span>
                            <i class="fa-solid fa-gear"></i>
                            Configuración
                        </span>

                        <i class="fa-solid fa-angle-down"></i>
                    </button>

                </div>

            </div>

            <!-- FOOTER -->

            <div class="sidebar-footer">

                <p>
                    <i class="fa-solid fa-headset"></i>
                    Soporte Técnico
                </p>

                <p>
                    <i class="fa-regular fa-circle-question"></i>
                    Centro de Ayuda
                </p>

            </div>

        </aside>

        <!-- MAIN -->

        <main class="main">

            <!-- TOPBAR -->

            <div class="topbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" placeholder="Buscar">

                </div>

                <div class="top-icons">

                    <i class="fa-regular fa-calendar"></i>

                    <i class="fa-solid fa-bell"></i>

                    <i class="fa-solid fa-message"></i>

                    <div class="separator"></div>

                    <i class="fa-solid fa-user"></i>

                </div>

            </div>

            <!-- TITULO -->

            <div class="header-content">

                <h2>Hola, Administrador</h2>

                <button class="design-btn">
                    Diseño de Página
                </button>

            </div>

            <!-- CONTENIDO -->

            <div class="documents-container">

                <!-- IZQUIERDA -->

                <div class="copro-section">

                    <h2>Copropiedades</h2>

                    <select multiple>

                        <option>Conjunto Residencial Marensa</option>
                        <option>Edificio Época</option>
                        <option>Conjunto Lugano</option>
                        <option>Conjunto Residencial Salvator</option>

                    </select>

                </div>

                <!-- DERECHA -->

                <div class="documents-grid">

                    <button class="doc-btn active-doc">
                        Copropiedad
                    </button>

                    <button class="doc-btn active-orange">
                        Actas
                    </button>

                    <button class="doc-btn">
                        Reglamentos
                    </button>

                    <button class="doc-btn">
                        Manuales
                    </button>

                    <button class="doc-btn">
                        Contratos
                    </button>

                    <button class="doc-btn">
                        Pólizas
                    </button>

                    <button class="doc-btn">
                        Soporte
                    </button>

                    <button class="doc-btn">
                        Evidencias
                    </button>

                </div>

            </div>

        </main>

    </div>

<script src="pagina13.js"></script>

</body>
</html>
